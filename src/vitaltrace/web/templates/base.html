<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VitalTrace{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js"></script>
  <script>
    // Mostra também as respostas 4xx/5xx dos fragmentos (mensagens de erro da análise).
    htmx.config.responseHandling = [
      {code: "204", swap: false},
      {code: "[23]..", swap: true},
      {code: "[45]..", swap: true, error: false}
    ];
  </script>
</head>
<body>
{% if doctor %}
<header class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="VitalTrace, início">
      <img src="/static/img/logo.svg" width="34" height="34" alt="">
      <span>VitalTrace</span>
    </a>
    <div class="row" style="gap:20px">
      <span class="muted" style="font-size:14px">{{ hospital }}</span>
      <span class="row" style="gap:10px">
        <span class="avatar" aria-hidden="true">{{ doctor.name | initials }}</span>
        <span style="font-size:14px;line-height:1.3"><b>{{ doctor.name }}</b><br><span class="muted">{{ doctor.crm }}</span></span>
      </span>
      <a href="/logout" style="font-size:14px;font-weight:600;text-decoration:none;padding:10px 4px">Sair</a>
    </div>
  </div>
</header>
<div id="banner" hx-get="/alerts/banner" hx-trigger="load, every 3s, alerts-changed from:body" hx-swap="innerHTML"></div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
