{% if critical %}
<div class="banner" role="alert">
  <div class="wrap">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>
    <b>{{ critical|length }} alerta{{ 's' if critical|length > 1 }} crítico{{ 's' if critical|length > 1 }} em aberto</b>
    <span>{{ critical[0].patient.name }}: {{ critical[0].title }}</span>
    <a href="/patients/{{ critical[0].patient_id }}">Abrir paciente</a>
  </div>
</div>
{% endif %}
