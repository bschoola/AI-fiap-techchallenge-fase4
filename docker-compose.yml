# Pré-requisito: copiar .env.example para .env (preencher o Azure ou usar MOCK_AZURE=true).
# Subir:  docker compose up --build        Portal: http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitaltrace
      POSTGRES_PASSWORD: vitaltrace
      POSTGRES_DB: vitaltrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaltrace -d vitaltrace"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        WITH_YOLO: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vitaltrace:vitaltrace@db:5432/vitaltrace
    volumes:
      - yolo-weights:/root/.config/Ultralytics   # evita baixar os pesos a cada recriação
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  yolo-weights:
