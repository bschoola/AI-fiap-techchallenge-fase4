# Pré-requisito: copiar .env.example para .env e preencher (ou MOCK_AZURE=true).
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/alerts.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
